name: Compile merged OpenIDEA for macOS arm64
on:
  push:
    branches: [codex/build-openidea-20261107]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-openidea-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  bindings:
    name: Generate TypeScript bindings
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: compile-macos-arm64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Generate bindings from Rust types
        run: |
          mkdir -p dist
          pnpm gen:bindings
          echo GENERATED_BINDINGS_BASE64_BEGIN
          base64 < src/bindings.ts
          echo GENERATED_BINDINGS_BASE64_END
          git hash-object src/bindings.ts
      - uses: actions/upload-artifact@v6
        with:
          name: generated-typescript-bindings
          path: src/bindings.ts
          if-no-files-found: error
          retention-days: 14
  macos:
    needs: bindings
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: compile-macos-${{ matrix.arch }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: generated-typescript-bindings
          path: src
      - name: Verify bindings against the generator
        run: |
          mkdir -p dist
          cp src/bindings.ts /tmp/expected-bindings.ts
          pnpm gen:bindings
          cmp src/bindings.ts /tmp/expected-bindings.ts
      - name: Compile app and DMG without publishing or signing
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Archive app with executable permissions
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/bundle/macos/OpenIDEA.app OpenIDEA-0.1.39-macos-${{ matrix.arch }}.app.zip
          shasum -a 256 OpenIDEA-0.1.39-macos-${{ matrix.arch }}.app.zip target/${{ matrix.target }}/release/bundle/dmg/*.dmg > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - name: Upload compiled app and installer
        uses: actions/upload-artifact@v6
        with:
          name: OpenIDEA-0.1.39-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            OpenIDEA-0.1.39-macos-${{ matrix.arch }}.app.zip
            SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14
